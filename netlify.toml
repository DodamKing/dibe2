[dev]
  command = "nuxt"
  port = 3000
  targetPort = 3333
  # Nuxt 2(webpack) 첫 빌드가 이 시간을 넘기면 netlify dev 가 "Timed out waiting for port 3333"
  # 으로 죽는다. `.nuxt` 캐시가 있으면 ~10초라 넉넉해 보이지만, **캐시가 없으면 60초를 넘긴다**
  # (클론 직후·새 환경·CI에서 반드시 밟는다. 실측 2026-07-17: 캐시 없음 실패 → 캐시 있음 9.5초 성공).
  # 서버가 일찍 뜨면 그만큼만 기다리므로 값을 키워도 평소 체감은 그대로다.
  targetPortReadyTimeout = 180

[build]
  command = "nuxt generate"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["bcrypt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# dev 전용 경로는 SPA 폴백에 먹히지 않게 그대로 통과시킨다. `netlify dev`는 파일 존재 여부를
# nuxt dev 서버가 아니라 `dist/`로 판단해서, 이게 없으면 `/_nuxt/app.js`까지 index.html로 바뀌어
# 화면이 "Loading..."에서 멈춘다(콘솔 `Unexpected token '<'`). 로딩 화면(`/_loading`)·HMR도 같은 병.
# 운영에선 `/_nuxt/*` 파일이 실제로 있어 이 규칙과 무관하게 그대로 서빙된다.
[[redirects]]
  from = "/_nuxt/*"
  to = "/_nuxt/:splat"
  status = 200

[[redirects]]
  from = "/_loading/*"
  to = "/_loading/:splat"
  status = 200

[[redirects]]
  from = "/__webpack_hmr/*"
  to = "/__webpack_hmr/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
